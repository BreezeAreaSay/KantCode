# Сервис по расписанию вместе с локальной моделью: ни ключей, ни аккаунтов.
#   docker compose up -d                 — планировщик + Ollama
#   docker compose run --rm app run      — ручной запуск того же процесса
#   docker compose run --rm -v ./examples:/examples app check /examples/kantkod_sample_vacancies.json --out /data/check-report.json
services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama

  # Один раз скачивает модель и завершается.
  model:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${TV_AI_MODEL:-qwen2.5:7b}"]
    restart: "no"

  app:
    build: .
    depends_on:
      model:
        condition: service_completed_successfully
    environment:
      TV_SOURCE_URL: ${TV_SOURCE_URL:-http://opendata.trudvsem.ru/api/v1/vacancies/region/39}
      TV_MAX_VACANCIES: ${TV_MAX_VACANCIES:-100}
      TV_PAGE_SIZE: ${TV_PAGE_SIZE:-50}
      TV_SCHEDULE: ${TV_SCHEDULE:-0 6 * * *}
      TV_AI_BASE_URL: ${TV_AI_BASE_URL:-http://ollama:11434/v1}
      TV_AI_MODEL: ${TV_AI_MODEL:-qwen2.5:7b}
      TV_AI_API_KEY: ${TV_AI_API_KEY:-}
      TV_AI_TIMEOUT: ${TV_AI_TIMEOUT:-600}
      TZ: Europe/Kaliningrad
    volumes:
      - ./reports:/data
    restart: unless-stopped

volumes:
  ollama:
