# Расписание рабочего режима в GitHub Actions.
# Модель задаётся в настройках репозитория: Settings → Secrets and variables → Actions.
#   Variables: TV_AI_BASE_URL, TV_AI_MODEL (и при желании TV_MAX_VACANCIES)
#   Secrets:   TV_AI_API_KEY
# Без TV_AI_BASE_URL запуск идёт только на правилах, и отчёт прямо говорит об этом в meta.ai.
name: vacancy-report

on:
  schedule:
    - cron: "0 4 * * *" # 06:00 по Калининграду (UTC+2)
  workflow_dispatch:
    inputs:
      max_vacancies:
        description: "Максимум вакансий"
        default: "100"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Прошлый успешный отчёт и кэш разборов переживают запуски:
      # при сбое портала в артефакт уйдёт прошлый отчёт, а неизменённые вакансии не разбираются заново.
      - uses: actions/cache@v4
        with:
          path: reports
          key: reports-${{ github.run_id }}
          restore-keys: reports-

      - name: Рабочий режим
        env:
          TV_MAX_VACANCIES: ${{ inputs.max_vacancies || vars.TV_MAX_VACANCIES || '100' }}
          TV_AI_ENABLED: ${{ vars.TV_AI_BASE_URL != '' }}
          TV_AI_BASE_URL: ${{ vars.TV_AI_BASE_URL }}
          TV_AI_MODEL: ${{ vars.TV_AI_MODEL }}
          TV_AI_API_KEY: ${{ secrets.TV_AI_API_KEY }}
        run: python -m transparent_vacancy run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vacancy-report
          path: |
            reports/report.json
            reports/last_run.json
          if-no-files-found: warn
